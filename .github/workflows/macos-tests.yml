name: macOS Test

on:
    push:
        branches: ["main"]
        tags:
            - "v*"
    pull_request:
        branches: ["main"]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    test-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable

            - name: Build
              run: cargo build --release --verbose

            - name: Test
              run: cargo test --release --verbose

            - name: Executar analise nos arquivos de teste
              shell: bash
              run: |
                  set -uo pipefail
                  BIN="./target/release/Compilador"

                  shopt -s nullglob
                  test_files=(testes/*.c)
                  if [ ${#test_files[@]} -eq 0 ]; then
                      echo "Nenhum arquivo de teste encontrado em testes/"
                      exit 1
                  fi

                  failed=0
                  for f in "${test_files[@]}"; do
                      echo "::group::Analisando $f"
                      if "$BIN" "$f" --no-output; then
                          status=0
                      else
                          status=$?
                      fi
                      case "$(basename "$f")" in
                          erro_*)
                              # Arquivos erro_*.c devem terminar com codigo != 0.
                              if [ "$status" -ne 0 ]; then
                                  echo "OK (erro detectado como esperado): $f"
                              else
                                  echo "FALHA (esperava erro, mas foi aceito): $f"
                                  failed=$((failed + 1))
                              fi
                              ;;
                          *)
                              if [ "$status" -eq 0 ]; then
                                  echo "OK (aceito): $f"
                              else
                                  echo "FALHA (esperava aceitar, mas deu erro): $f"
                                  failed=$((failed + 1))
                              fi
                              ;;
                      esac
                      echo "::endgroup::"
                  done

                  if [ "$failed" -ne 0 ]; then
                      echo "$failed arquivo(s) de teste falharam"
                      exit 1
                  fi
                  echo "Todos os testes executaram com sucesso"
